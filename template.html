<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>~/writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0a0a0a;
    --fg:#7d7d7d;
    --fg-bright:#e6e6e6;
    --gutter:#3a3a3a;
    --rule:#1c1c1c;
    --accent:#7ee787;
    --font:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --scale:1.2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:var(--font);font-feature-settings:"liga" 0,"calt" 0;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
    height:100%;overflow:hidden}
  a{color:inherit;text-decoration:none}

  /* ─── Layout ─────────────────────────────────────────────── */
  #app{height:100vh;display:grid;grid-template-rows:1fr;}
  #buffer{overflow:auto;position:relative;scrollbar-width:none}
  #buffer::-webkit-scrollbar{display:none}

  /* ─── List view ──────────────────────────────────────────── */
  .list{padding:.15em 0 1.2em;margin:0;list-style:none;
    font-size:calc(3rem * var(--scale));line-height:1;letter-spacing:-0.02em;
    font-weight:500;text-transform:uppercase;}
  .row{display:grid;grid-template-columns:max-content 1fr;
    align-items:center;column-gap:.4ch;
    padding:0 1.2ch 0 0;cursor:pointer;
    position:relative;
    margin-bottom:0.05em;}
  .row:last-child{margin-bottom:0}
  .row .gut{color:var(--gutter);font-size:0.38em;line-height:1.1;
    display:flex;flex-direction:column;align-items:flex-end;
    padding-left:.4ch;min-width:2.5ch;
    font-variant-numeric:tabular-nums;letter-spacing:0;}
  .row .gut .hash{opacity:.7}
  .row .gut .num{}
  .row .ttl{white-space:nowrap;overflow:visible}
  .row .tag{display:none}

  .row.is-selected{color:var(--fg-bright);}
  .row.is-selected .gut{color:var(--accent)}
  .row.is-selected::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  }
  .row.is-hidden{display:none}
  .row .ttl em{font-style:normal;background:var(--accent);color:#0a0a0a;padding:0 .1ch}

  .row.is-selected .ttl::after{
    content:"";display:inline-block;width:0.55ch;height:0.85em;
    background:var(--accent);margin-left:.25ch;vertical-align:-0.05em;
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ─── Detail view ────────────────────────────────────────── */
  .detail{display:none;padding:2.4rem clamp(1.5rem,6vw,5rem) 4rem;
    max-width:78ch;margin:0 auto;color:var(--fg-bright);font-size:1.0rem;line-height:1.65}
  .detail.is-open{display:block}
  .detail .meta{color:var(--gutter);font-size:.78rem;letter-spacing:.18em;
    text-transform:uppercase;margin-bottom:1.6rem;display:flex;gap:1.5ch;flex-wrap:wrap;
    align-items:center}
  .detail .meta .k{color:var(--accent)}
  .detail .back{margin-left:auto;color:var(--accent);cursor:pointer;
    border:1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    padding:.25rem .8ch;border-radius:2px;
    font-size:.72rem;letter-spacing:.18em;
    display:inline-flex;align-items:center;gap:.6ch;
    transition:background .12s ease}
  .detail .back:hover{background:color-mix(in oklab, var(--accent) 18%, transparent)}
  .detail .back kbd{font-family:inherit;color:var(--fg-bright);
    background:#1a1a1a;border:1px solid #2a2a2a;border-radius:2px;
    padding:.05rem .5ch;font-size:.65rem;letter-spacing:.08em}
  .detail h1{font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1;margin:0 0 1.4rem;
    text-transform:uppercase;letter-spacing:-.01em;font-weight:500;color:var(--fg-bright)}
  .detail h2{font-size:1.05rem;margin:2.2rem 0 .6rem;text-transform:uppercase;
    letter-spacing:.1em;color:var(--accent);font-weight:500}
  .detail p{margin:0 0 1.1rem;color:#bdbdbd}
  .detail p.lede{color:var(--fg-bright);font-size:1.15rem}
  .detail a.link{color:var(--accent);border-bottom:1px solid color-mix(in oklab, var(--accent) 40%, transparent)}
  .detail a.link:hover{background:color-mix(in oklab, var(--accent) 18%, transparent)}
  .detail pre{background:#111;border-left:2px solid var(--accent);
    padding:1rem 1.2rem;overflow:auto;font-size:.85rem;color:#cfcfcf;margin:1rem 0 1.4rem}
  .detail blockquote{border-left:2px solid var(--gutter);padding:.2rem 0 .2rem 1.4ch;
    color:#9b9b9b;margin:1rem 0;font-style:normal}
  .detail .poem{white-space:pre-wrap;color:#d1d1d1;font-size:1.02rem;line-height:1.75}
  .detail .placeholder{display:block;background:
      repeating-linear-gradient(45deg,#161616 0 10px,#1c1c1c 10px 20px);
    height:18rem;border:1px dashed #2a2a2a;color:#666;
    display:flex;align-items:center;justify-content:center;letter-spacing:.2em;
    font-size:.8rem;margin:1.4rem 0}
  .detail ul.links{list-style:none;padding:0;margin:0}
  .detail ul.links li{padding:.35rem 0;border-bottom:1px solid #1a1a1a;
    display:flex;justify-content:space-between;gap:1ch}
  .detail ul.links li .arrow{color:var(--accent)}

  .statusline{display:none}
  .cmdline{display:none}

  .hint{display:none}

  @media (max-width:780px){
    .list{font-size:calc(2.2rem * var(--scale))}
  }
</style>
</head>
<body>

<div id="app">

  <main id="buffer" tabindex="-1">

    <!-- ============ LIST VIEW ============ -->
    <ul class="list" id="list" data-view="list">
{{LIST_ROWS}}
    </ul>

    <!-- ============ DETAIL ARTICLES ============ -->
{{DETAIL_ARTICLES}}

  </main>

  <!-- ============ STATUSLINE ============ -->
  <div class="statusline" id="statusline" role="status" aria-live="polite">
    <div class="seg mode" id="mode">NORMAL</div>
    <div class="seg file" id="file">~/writing/<span id="filename">index.md</span><span class="mod" id="modflag"></span></div>
    <div class="seg right" id="counts"></div>
    <div class="seg pos" id="pos">1:1</div>
  </div>

  <!-- ============ CMDLINE ============ -->
  <div class="cmdline is-hidden" id="cmdline">
    <span class="pfx" id="cmdpfx">:</span><span class="txt" id="cmdtxt"></span><span class="caret"></span>
    <span class="ghost" id="cmdghost"></span>
  </div>

</div>

<div class="hint">PRESS&nbsp;&nbsp;?&nbsp;FOR&nbsp;KEYS&nbsp;&nbsp;·&nbsp;&nbsp;:HELP</div>

<script>
(() => {
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];

  const buffer    = $('#buffer');
  const list      = $('#list');
  const rows      = () => $$('.row:not(.is-hidden)', list);
  const statusLn  = $('#statusline');
  const modeEl    = $('#mode');
  const filenameEl= $('#filename');
  const posEl     = $('#pos');
  const countsEl  = $('#counts');
  const cmdline   = $('#cmdline');
  const cmdpfx    = $('#cmdpfx');
  const cmdtxt    = $('#cmdtxt');
  const cmdghost  = $('#cmdghost');

  let mode = 'normal';
  let selIdx = 0;
  let cmdBuf = '';
  let pendingNum = '';
  let pendingOp  = '';
  let searchQuery = '';
  let lastView = 'list';

  const total = () => rows().length;

  function setMode(m){
    mode = m;
    statusLn.classList.remove('is-search','is-command');
    if(m==='search') statusLn.classList.add('is-search');
    if(m==='command') statusLn.classList.add('is-command');
    modeEl.textContent = m === 'normal' ? 'NORMAL'
                     : m === 'search'   ? 'SEARCH'
                     : m === 'command'  ? 'COMMAND'
                     : m === 'detail'   ? 'READ' : m.toUpperCase();
    cmdline.classList.toggle('is-hidden', !(m==='search'||m==='command'));
  }

  function updateStatus(){
    const visible = rows();
    const n = visible.length;
    const idx = Math.min(selIdx, Math.max(0,n-1));
    const cur = visible[idx];
    const id  = cur ? cur.dataset.id : '';
    if(mode==='detail'){
      filenameEl.textContent = id ? `${id}.md` : 'index.md';
    } else {
      filenameEl.textContent = 'index.md';
    }
    countsEl.innerHTML = mode==='detail'
      ? '<span class="hint-back" data-back="1"><kbd>esc</kbd>back to list</span>'
      : `${n} entries`;
    posEl.textContent = mode==='detail' ? '—' : `${idx+1}:${n}`;
  }

  function paintSelection(){
    const visible = rows();
    visible.forEach((r,i)=>r.classList.toggle('is-selected', i===selIdx));
    const cur = visible[selIdx];
    if(cur){
      const r = cur.getBoundingClientRect();
      const br = buffer.getBoundingClientRect();
      if(r.top < br.top + 24) buffer.scrollBy({top: r.top - br.top - 24, behavior:'smooth'});
      else if(r.bottom > br.bottom - 24) buffer.scrollBy({top: r.bottom - br.bottom + 24, behavior:'smooth'});
    }
    updateStatus();
  }

  function moveTo(i){
    const n = total();
    if(n===0) return;
    selIdx = Math.max(0, Math.min(n-1, i));
    paintSelection();
  }

  function ensureBackBtn(art){
    const meta = art.querySelector('.meta');
    if(meta && !meta.querySelector('.back')){
      const a = document.createElement('a');
      a.className = 'back'; a.dataset.back = '1';
      a.innerHTML = '\u2190 back <kbd>esc</kbd>';
      meta.appendChild(a);
    }
  }

  function openDetail(id){
    if(!id) return;
    const art = $(`.detail[data-id="${CSS.escape(id)}"]`);
    if(!art) return;
    ensureBackBtn(art);
    list.style.display = 'none';
    $$('.detail').forEach(a => a.classList.toggle('is-open', a===art));
    setMode('detail');
    buffer.scrollTop = 0;
    lastView = 'detail';
    updateStatus();
  }

  function closeDetail(){
    $$('.detail.is-open').forEach(a => a.classList.remove('is-open'));
    list.style.display = '';
    setMode('normal');
    lastView = 'list';
    paintSelection();
  }

  function applySearch(q){
    searchQuery = q;
    const ql = q.toLowerCase().trim();
    $$('.row', list).forEach(r => {
      const t = r.querySelector('.ttl').textContent.toLowerCase();
      const tag = (r.dataset.tag||'').toLowerCase();
      const hit = !ql || t.includes(ql) || tag.includes(ql);
      r.classList.toggle('is-hidden', !hit);
      const ttl = r.querySelector('.ttl');
      const original = ttl.dataset.original || (ttl.dataset.original = ttl.textContent);
      if(ql){
        const i = original.toLowerCase().indexOf(ql);
        if(i>=0){
          ttl.innerHTML = original.slice(0,i)
            + '<em>'+original.slice(i,i+ql.length)+'</em>'
            + original.slice(i+ql.length);
        } else ttl.textContent = original;
      } else ttl.textContent = original;
    });
    selIdx = 0;
    paintSelection();
  }

  function clearSearch(){
    applySearch('');
  }

  function runCommand(raw){
    const c = raw.trim();
    if(!c) return;
    if(/^\d+$/.test(c)){ moveTo(parseInt(c,10)-1); return; }
    if(c==='q' || c==='quit' || c==='close') { if(mode==='detail') closeDetail(); return; }
    if(c==='help' || c==='h')    { showHelp(); return; }
    if(c==='clear' || c==='noh') { clearSearch(); return; }
    if(c.startsWith('e ') || c.startsWith('edit ')){
      const id = c.split(/\s+/)[1];
      const match = $$('.row').find(r=>r.dataset.id===id);
      if(match){
        applySearch('');
        const vis = rows();
        const idx = vis.indexOf(match);
        if(idx>=0){ moveTo(idx); openDetail(id); }
      } else flash(`no such entry: ${id}`);
      return;
    }
    flash(`E492: not a command: ${c}`);
  }

  function flash(msg){
    cmdghost.textContent = msg;
    cmdline.classList.remove('is-hidden');
    cmdpfx.textContent = '';
    cmdtxt.textContent = '';
    setTimeout(()=>{
      if(mode==='normal'||mode==='detail') cmdline.classList.add('is-hidden');
      cmdghost.textContent = '';
    }, 1600);
  }

  function showHelp(){
    const id = 'help';
    let art = $(`.detail[data-id="${id}"]`);
    if(!art){
      art = document.createElement('article');
      art.className = 'detail'; art.dataset.id = id;
      art.innerHTML = `
        <div class="meta"><span><span class="k">type</span> HELP</span><span><span class="k">version</span> 0.1</span></div>
        <h1>Keys</h1>
        <h2>Navigation</h2>
        <pre>j / ↓        next entry
k / ↑        previous entry
gg           top
G            bottom
NUM gg       go to entry NUM   (e.g. 5gg)
o / Enter    open selected
Esc / q      back to list (from a detail)
?            toggle this help</pre>
        <h2>Search</h2>
        <pre>/text        filter the list (live)
Enter        confirm filter
Esc          cancel search
:noh         clear filter</pre>
        <h2>Commands</h2>
        <pre>:NN          jump to entry NN
:e id        open entry by id (e.g. :e moth)
:q           close detail
:help        this help
:clear       clear search</pre>
        <h2>Mouse</h2>
        <pre>click row    open it</pre>`;
      buffer.appendChild(art);
    }
    list.style.display = 'none';
    $$('.detail').forEach(a => a.classList.toggle('is-open', a===art));
    setMode('detail');
    buffer.scrollTop = 0;
    updateStatus();
  }

  function renderCmdline(){
    cmdpfx.textContent = mode==='search' ? '/' : mode==='command' ? ':' : '';
    cmdtxt.textContent = cmdBuf;
    cmdghost.textContent = '';
  }

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;

    if(mode==='search' || mode==='command'){
      if(e.key==='Escape'){
        if(mode==='search') clearSearch();
        cmdBuf=''; setMode(lastView==='detail'?'detail':'normal'); renderCmdline();
        e.preventDefault(); return;
      }
      if(e.key==='Enter'){
        if(mode==='search'){
          setMode(lastView==='detail' ? 'detail' : 'normal');
          cmdBuf=''; renderCmdline();
        } else {
          runCommand(cmdBuf);
          cmdBuf=''; setMode(lastView==='detail' ? 'detail' : 'normal'); renderCmdline();
        }
        e.preventDefault(); return;
      }
      if(e.key==='Backspace'){
        cmdBuf = cmdBuf.slice(0,-1);
        if(mode==='search') applySearch(cmdBuf);
        renderCmdline();
        e.preventDefault(); return;
      }
      if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey){
        cmdBuf += e.key;
        if(mode==='search') applySearch(cmdBuf);
        renderCmdline();
        e.preventDefault(); return;
      }
      return;
    }

    if(mode==='detail'){
      if(e.key==='Escape' || e.key==='q'){ closeDetail(); e.preventDefault(); return; }
      if(e.key===':'){ cmdBuf=''; setMode('command'); renderCmdline(); e.preventDefault(); return; }
      if(e.key==='/'){ cmdBuf=''; setMode('search'); renderCmdline(); e.preventDefault(); return; }
      if(e.key==='j' || e.key==='ArrowDown'){ buffer.scrollBy({top:60,behavior:'smooth'}); e.preventDefault(); return; }
      if(e.key==='k' || e.key==='ArrowUp'){ buffer.scrollBy({top:-60,behavior:'smooth'}); e.preventDefault(); return; }
      if(e.key==='g' && pendingOp==='g'){ buffer.scrollTo({top:0,behavior:'smooth'}); pendingOp=''; e.preventDefault(); return; }
      if(e.key==='g'){ pendingOp='g'; setTimeout(()=>pendingOp='',600); e.preventDefault(); return; }
      if(e.key==='G'){ buffer.scrollTo({top:buffer.scrollHeight,behavior:'smooth'}); e.preventDefault(); return; }
      if(e.key==='?'){ showHelp(); e.preventDefault(); return; }
      return;
    }

    if(e.key==='Escape'){ pendingNum=''; pendingOp=''; clearSearch(); return; }
    if(e.key===':'){ cmdBuf=''; setMode('command'); renderCmdline(); e.preventDefault(); return; }
    if(e.key==='/'){ cmdBuf=''; setMode('search'); renderCmdline(); e.preventDefault(); return; }
    if(e.key==='j' || e.key==='ArrowDown'){ moveTo(selIdx+1); e.preventDefault(); return; }
    if(e.key==='k' || e.key==='ArrowUp'){ moveTo(selIdx-1); e.preventDefault(); return; }
    if(e.key==='Enter' || e.key==='o'){
      const cur = rows()[selIdx]; if(cur) openDetail(cur.dataset.id); e.preventDefault(); return;
    }
    if(e.key==='?'){ showHelp(); e.preventDefault(); return; }

    if(/^\d$/.test(e.key)){ pendingNum += e.key; e.preventDefault(); return; }
    if(e.key==='g'){
      if(pendingOp==='g'){
        if(pendingNum){ moveTo(parseInt(pendingNum,10)-1); pendingNum=''; }
        else moveTo(0);
        pendingOp=''; e.preventDefault(); return;
      } else {
        pendingOp='g';
        setTimeout(()=>{pendingOp=''; pendingNum='';}, 700);
        e.preventDefault(); return;
      }
    }
    if(e.key==='G'){
      if(pendingNum){ moveTo(parseInt(pendingNum,10)-1); pendingNum=''; }
      else moveTo(total()-1);
      e.preventDefault(); return;
    }
  });

  document.addEventListener('click', (e) => {
    if(e.target.closest('[data-back]')){ closeDetail(); e.preventDefault(); }
  });

  list.addEventListener('mouseover', (e) => {
    const r = e.target.closest('.row'); if(!r) return;
    const vis = rows(); const i = vis.indexOf(r);
    if(i>=0 && i!==selIdx){ selIdx=i; paintSelection(); }
  });

  list.addEventListener('click', (e) => {
    const r = e.target.closest('.row'); if(!r) return;
    const vis = rows(); const i = vis.indexOf(r);
    if(i>=0){ selIdx=i; paintSelection(); openDetail(r.dataset.id); }
  });

  paintSelection();
  setMode('normal');
  updateStatus();
  buffer.focus();
})();
</script>

</body>
</html>
