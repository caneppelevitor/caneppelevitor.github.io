<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>general thoughts</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#1F1F28;
    --fg:#aca9a4;
    --fg-bright:#DCD7BA;
    --gutter:#393836;
    --rule:#363646;
    --accent:#c4b28a;
    --font:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --scale:1.2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:var(--font);font-feature-settings:"liga" 0,"calt" 0;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
    height:100%;overflow:hidden}
  a{color:inherit;text-decoration:none}

  /* ─── Layout ─────────────────────────────────────────────── */
  #app{height:100vh;display:grid;grid-template-rows:1fr;}
  #buffer{overflow:auto;position:relative;scrollbar-width:none}
  #buffer::-webkit-scrollbar{display:none}

  /* ─── List view ──────────────────────────────────────────── */
  .list{padding:.15em 0 1.2em;margin:0;list-style:none;
    font-size:calc(2.4rem * var(--scale));line-height:1;letter-spacing:-0.02em;
    font-weight:500;text-transform:uppercase;}
  .row{display:grid;grid-template-columns:max-content 1fr;
    align-items:center;column-gap:.4ch;
    padding:0 1.2ch 0 0;cursor:pointer;
    position:relative;
    margin-bottom:0.05em;}
  .row:last-child{margin-bottom:0}
  .row .gut{color:var(--gutter);font-size:0.38em;line-height:1.1;
    display:flex;flex-direction:column;align-items:flex-end;
    padding-left:.4ch;min-width:2.5ch;
    font-variant-numeric:tabular-nums;letter-spacing:0;}
  .row .gut .hash{opacity:.7}
  .row .gut .num{}
  .row .ttl{white-space:nowrap;overflow:visible}
  .row .tag{display:none}

  .row.is-selected{color:var(--fg-bright);}
  .row.is-selected .gut{color:var(--accent)}
  .row.is-hidden{display:none}
  .row .ttl em{font-style:normal;background:var(--accent);color:var(--bg);padding:0 .1ch}

  /* ─── Detail view ────────────────────────────────────────── */
  .detail{display:none;padding:2.4rem clamp(1.5rem,6vw,5rem) 4rem;
    max-width:100ch;margin:0 auto;color:var(--fg-bright);font-size:1.0rem;line-height:1.65}
  .detail.is-open{display:block}
  .detail .meta{color:#8ea49e;font-size:.78rem;letter-spacing:.18em;
    text-transform:uppercase;margin-bottom:1.6rem;display:flex;gap:1.5ch;flex-wrap:wrap;
    align-items:center}
  .detail .meta .k{color:var(--accent)}
  .detail .back{margin-left:auto;color:var(--accent);cursor:pointer;
    border:1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    padding:.25rem .8ch;border-radius:2px;
    font-size:.72rem;letter-spacing:.18em;
    display:inline-flex;align-items:center;gap:.6ch;
    transition:background .12s ease}
  .detail .back:hover{background:color-mix(in oklab, var(--accent) 18%, transparent)}
  .detail .back kbd{font-family:inherit;color:var(--fg-bright);
    background:#2a2a37;border:1px solid #363646;border-radius:2px;
    padding:.05rem .5ch;font-size:.65rem;letter-spacing:.08em}
  .detail h1{font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1;margin:0 0 1.4rem;
    text-transform:uppercase;letter-spacing:-.01em;font-weight:500;color:var(--fg-bright)}
  .detail h2{font-size:1.05rem;margin:2.2rem 0 .6rem;text-transform:uppercase;
    letter-spacing:.1em;color:var(--accent);font-weight:500}
  .detail p{margin:0 0 1.1rem;color:#C8C093}
  .detail p.lede{color:var(--fg-bright);font-size:1.15rem}
  .detail a:not(.back){color:#7fb4ca;text-decoration:underline;
    text-underline-offset:.2em;text-decoration-color:rgba(127,180,202,.4);
    transition:color .12s,text-decoration-color .12s}
  .detail a:not(.back):hover{color:#c4b28a;text-decoration-color:var(--accent)}
  .detail pre{background:#2a2a37;border-left:2px solid var(--accent);
    padding:1rem 1.2rem;overflow:auto;font-size:.85rem;color:#C8C093;margin:1rem 0 1.4rem}
  .detail blockquote{border-left:2px solid var(--accent);padding:.6rem 0 .6rem 1.4ch;
    color:var(--fg-bright);margin:1.2rem 0;font-style:italic;
    background:rgba(196,178,138,.06);border-radius:0 4px 4px 0}
  .detail .poem{white-space:pre-wrap;color:#C8C093;font-size:1.02rem;line-height:1.75}
  .detail .placeholder{display:block;background:
      repeating-linear-gradient(45deg,#2a2a37 0 10px,#363646 10px 20px);
    height:18rem;border:1px dashed #363646;color:#aca9a4;
    display:flex;align-items:center;justify-content:center;letter-spacing:.2em;
    font-size:.8rem;margin:1.4rem 0}
  .detail ul.links{list-style:none;padding:0;margin:0}
  .detail ul.links li{padding:.35rem 0;border-bottom:1px solid #363646;
    display:flex;justify-content:space-between;gap:1ch}
  .detail ul.links li .arrow{color:var(--accent)}

  /* ─── Table of contents ───────────────────────────────────── */
  .detail-wrap{display:grid;grid-template-columns:1fr 200px;gap:2rem;
    max-width:120ch;margin:0 auto;padding:2.4rem clamp(1.5rem,4vw,3rem) 4rem}
  .detail-wrap .detail{padding:0;max-width:none;margin:0}
  .toc{position:sticky;top:2.4rem;align-self:start;
    font-size:.72rem;letter-spacing:.08em;line-height:1.6;
    color:var(--fg);max-height:calc(100vh - 4.8rem);overflow-y:auto;
    scrollbar-width:none;padding-top:.2rem}
  .toc::-webkit-scrollbar{display:none}
  .toc-title{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;
    font-weight:500;margin-bottom:.8rem;font-size:.65rem}
  .toc a{display:block;padding:.25rem 0 .25rem .8ch;
    border-left:1px solid var(--rule);color:var(--fg);
    text-decoration:none;transition:color .12s,border-color .12s}
  .toc a:hover,.toc a.is-active{color:var(--fg-bright);border-left-color:var(--accent)}
  .toc a.toc-h3{padding-left:1.6ch;font-size:.68rem}

  @media (max-width:900px){
    .detail-wrap{grid-template-columns:1fr;padding:2.4rem clamp(1.5rem,6vw,5rem) 4rem}
    .toc{display:none}
  }
  @media (max-width:780px){
    .list{font-size:calc(2.2rem * var(--scale))}
  }
</style>
</head>
<body>

<div id="app">

  <main id="buffer" tabindex="-1">

    <!-- ============ LIST VIEW ============ -->
    <ul class="list" id="list" data-view="list">
{{LIST_ROWS}}
    </ul>

    <!-- ============ DETAIL ARTICLES ============ -->
    <div class="detail-wrap" id="detail-wrap" style="display:none">
      <div id="detail-content">
{{DETAIL_ARTICLES}}
      </div>
      <nav class="toc" id="toc">
        <div class="toc-title">On this page</div>
      </nav>
    </div>

  </main>

</div>

<script>
(() => {
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];

  const buffer     = $('#buffer');
  const list       = $('#list');
  const detailWrap = $('#detail-wrap');
  const toc        = $('#toc');
  const rows       = () => $$('.row:not(.is-hidden)', list);

  let view = 'list';
  let selIdx = 0;
  let pendingNum = '';
  let pendingOp  = '';

  function paintSelection(){
    const visible = rows();
    visible.forEach((r,i) => r.classList.toggle('is-selected', i===selIdx));
    const cur = visible[selIdx];
    if(cur){
      const r = cur.getBoundingClientRect();
      const br = buffer.getBoundingClientRect();
      if(r.top < br.top + 24) buffer.scrollBy({top: r.top - br.top - 24, behavior:'smooth'});
      else if(r.bottom > br.bottom - 24) buffer.scrollBy({top: r.bottom - br.bottom + 24, behavior:'smooth'});
    }
  }

  function moveTo(i){
    const n = rows().length;
    if(n===0) return;
    selIdx = Math.max(0, Math.min(n-1, i));
    paintSelection();
  }

  function ensureBackBtn(art){
    const meta = art.querySelector('.meta');
    if(meta && !meta.querySelector('.back')){
      const a = document.createElement('a');
      a.className = 'back'; a.dataset.back = '1';
      a.innerHTML = '\u2190 back <kbd>esc</kbd>';
      meta.appendChild(a);
    }
  }

  function buildToc(art){
    toc.querySelectorAll('a').forEach(a => a.remove());
    art.querySelectorAll('h2, h3').forEach((h, i) => {
      if(!h.id) h.id = 'section-' + i;
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      if(h.tagName === 'H3') a.classList.add('toc-h3');
      a.addEventListener('click', (e) => {
        e.preventDefault();
        h.scrollIntoView({behavior:'smooth', block:'start'});
      });
      toc.appendChild(a);
    });
  }

  function openDetail(id){
    if(!id) return;
    const art = $(`.detail[data-id="${CSS.escape(id)}"]`);
    if(!art) return;
    ensureBackBtn(art);
    list.style.display = 'none';
    detailWrap.style.display = '';
    $$('.detail').forEach(a => a.classList.toggle('is-open', a===art));
    buildToc(art);
    view = 'detail';
    buffer.scrollTop = 0;
  }

  function closeDetail(){
    $$('.detail.is-open').forEach(a => a.classList.remove('is-open'));
    detailWrap.style.display = 'none';
    list.style.display = '';
    view = 'list';
    paintSelection();
  }

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;

    if(view==='detail'){
      if(e.key==='Escape'){ closeDetail(); e.preventDefault(); return; }
      if(e.key==='j' || e.key==='ArrowDown'){ buffer.scrollBy({top:60,behavior:'smooth'}); e.preventDefault(); return; }
      if(e.key==='k' || e.key==='ArrowUp'){ buffer.scrollBy({top:-60,behavior:'smooth'}); e.preventDefault(); return; }
      if(e.key==='g' && pendingOp==='g'){ buffer.scrollTo({top:0,behavior:'smooth'}); pendingOp=''; e.preventDefault(); return; }
      if(e.key==='g'){ pendingOp='g'; setTimeout(()=>pendingOp='',600); e.preventDefault(); return; }
      if(e.key==='G'){ buffer.scrollTo({top:buffer.scrollHeight,behavior:'smooth'}); e.preventDefault(); return; }
      return;
    }

    if(e.key==='Escape'){ pendingNum=''; pendingOp=''; return; }
    if(e.key==='j' || e.key==='ArrowDown'){ moveTo(selIdx+1); e.preventDefault(); return; }
    if(e.key==='k' || e.key==='ArrowUp'){ moveTo(selIdx-1); e.preventDefault(); return; }
    if(e.key==='Enter' || e.key==='o'){
      const cur = rows()[selIdx]; if(cur) openDetail(cur.dataset.id); e.preventDefault(); return;
    }
    if(/^\d$/.test(e.key)){ pendingNum += e.key; e.preventDefault(); return; }
    if(e.key==='g'){
      if(pendingOp==='g'){
        if(pendingNum){ moveTo(parseInt(pendingNum,10)-1); pendingNum=''; }
        else moveTo(0);
        pendingOp=''; e.preventDefault(); return;
      }
      pendingOp='g'; setTimeout(()=>{pendingOp=''; pendingNum='';}, 700);
      e.preventDefault(); return;
    }
    if(e.key==='G'){
      if(pendingNum){ moveTo(parseInt(pendingNum,10)-1); pendingNum=''; }
      else moveTo(rows().length-1);
      e.preventDefault(); return;
    }
  });

  document.addEventListener('click', (e) => {
    if(e.target.closest('[data-back]')){ closeDetail(); e.preventDefault(); }
  });

  list.addEventListener('mouseover', (e) => {
    const r = e.target.closest('.row'); if(!r) return;
    const vis = rows(); const i = vis.indexOf(r);
    if(i>=0 && i!==selIdx){ selIdx=i; paintSelection(); }
  });

  list.addEventListener('click', (e) => {
    const r = e.target.closest('.row'); if(!r) return;
    const vis = rows(); const i = vis.indexOf(r);
    if(i>=0){ selIdx=i; paintSelection(); openDetail(r.dataset.id); }
  });

  $$('.detail a[href]').forEach(a => {
    if(!a.classList.contains('back') && !a.href.startsWith('#')){
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener');
    }
  });

  paintSelection();
  buffer.focus();
})();
</script>

</body>
</html>
